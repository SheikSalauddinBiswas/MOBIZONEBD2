<!DOCTYPE html>
<html lang="bn" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MobiZone BD — Buy · Sell · Exchange</title>
<meta name="description" content="নতুন মোবাইল কিনুন, পুরাতন ফোন এক্সচেঞ্জ করুন, গ্যাজেট নিন — MobiZone BD">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--amber:#fbb02d;--amber2:#ffcf6b;--bg:#15120e;--bg2:#1e1a14;--card:#241f18;--text:#f7f3ea;--mute:#a79f90;--line:rgba(255,255,255,.09);--glow:rgba(251,176,45,.28)}
[data-theme=light]{--bg:#f4f5f7;--bg2:#fff;--card:#fff;--text:#1b1812;--mute:#6b6558;--line:rgba(0,0,0,.09);--glow:rgba(251,176,45,.35)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Outfit','Hind Siliguri',sans-serif;background:var(--bg);color:var(--text);line-height:1.6;transition:background .4s,color .4s;overflow-x:hidden}
html[lang=bn] body{font-family:'Hind Siliguri','Outfit',sans-serif}
a{color:inherit;text-decoration:none}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
.wrap{width:min(1160px,92%);margin:auto}
svg.i{width:1.2em;height:1.2em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em}

/* header — always dark so the white logo letters stay visible */
header{position:sticky;top:0;z-index:50;background:rgba(21,18,14,.82);backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.08);color:#f7f3ea}
.nav{display:flex;align-items:center;gap:20px;height:68px}
.nav img{height:38px;width:auto}
.nav nav{margin-left:auto;display:flex;gap:26px;font-weight:500;font-size:.95rem}
.nav nav a{opacity:.8;transition:.25s;position:relative}
.nav nav a:hover{opacity:1;color:var(--amber)}
.tools{display:flex;gap:8px;margin-left:auto}
.nav nav+.tools{margin-left:0}
.chip{border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);border-radius:99px;padding:6px 14px;cursor:pointer;font-weight:600;font-size:.85rem;transition:.25s;color:#f7f3ea}
.chip:hover{border-color:var(--amber);color:var(--amber);transform:translateY(-1px)}

/* hero */
.hero{position:relative;padding:72px 0 90px;overflow:hidden}
.hero::before{content:"";position:absolute;width:620px;height:620px;right:-120px;top:-80px;background:radial-gradient(circle,var(--glow),transparent 65%);animation:pulse 6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.15);opacity:.7}}
.hero .wrap{display:grid;grid-template-columns:1.05fr .95fr;gap:48px;align-items:center;position:relative}
.badge{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--line);background:var(--bg2);padding:6px 14px;border-radius:99px;font-size:.85rem;color:var(--mute)}
.badge b{width:8px;height:8px;border-radius:50%;background:#3ecf6e;box-shadow:0 0 0 0 #3ecf6e;animation:ping 1.8s infinite}
@keyframes ping{70%{box-shadow:0 0 0 9px transparent}}
h1{font-size:clamp(2.3rem,5.4vw,4.1rem);line-height:1.12;font-weight:800;margin:18px 0;letter-spacing:-.02em}
h1 span{display:block;background:linear-gradient(90deg,var(--amber),var(--amber2),var(--amber));background-size:200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 5s linear infinite}
@keyframes shine{to{background-position:200%}}
.lead{color:var(--mute);max-width:46ch;font-size:1.08rem}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:13px 26px;border-radius:14px;font-weight:700;cursor:pointer;border:1px solid var(--line);background:var(--bg2);transition:.3s}
.btn:hover{transform:translateY(-3px)}
.btn.pri{background:linear-gradient(135deg,var(--amber),#f59a0c);color:#2a1c00;border:0;box-shadow:0 10px 30px -8px var(--glow)}
.btn.pri:hover{box-shadow:0 16px 36px -6px var(--glow)}
.stats{display:flex;gap:34px;margin-top:38px}
.stats b{font-size:1.8rem;color:var(--amber);display:block;line-height:1.1}
.stats small{color:var(--mute)}

/* exchange estimator (signature element) */
.est{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:26px;box-shadow:0 30px 70px -30px rgba(0,0,0,.5);position:relative}
.est::after{content:"";position:absolute;inset:-1px;border-radius:27px;padding:1px;background:linear-gradient(140deg,var(--amber),transparent 45%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.est h3{font-size:1.25rem;display:flex;gap:10px;align-items:center}
.est p.s{color:var(--mute);font-size:.9rem;margin-bottom:14px}
label{display:block;font-size:.82rem;color:var(--mute);margin:12px 0 6px}
select{width:100%;padding:12px 14px;border-radius:12px;background:var(--bg);border:1px solid var(--line);cursor:pointer}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg button{padding:10px 6px;border-radius:12px;background:var(--bg);border:1px solid var(--line);cursor:pointer;transition:.25s;font-size:.9rem}
.seg button.on{background:var(--amber);color:#2a1c00;border-color:var(--amber);font-weight:700;transform:scale(1.04)}
.res{margin-top:20px;padding:18px;border-radius:18px;background:linear-gradient(135deg,rgba(251,176,45,.16),rgba(251,176,45,.04));border:1px dashed var(--amber);text-align:center}
.res small{color:var(--mute)}
.res b{display:block;font-size:2.1rem;color:var(--amber);font-weight:800;line-height:1.2}

/* sections */
section{padding:84px 0}
.alt{background:var(--bg2)}
.head{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:34px;flex-wrap:wrap}
h2{font-size:clamp(1.7rem,3.4vw,2.4rem);font-weight:800;letter-spacing:-.01em}
.head p{color:var(--mute);max-width:48ch}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.cat{padding:30px;border-radius:24px;background:var(--card);border:1px solid var(--line);transition:.4s;position:relative;overflow:hidden}
.cat:hover{transform:translateY(-8px);border-color:var(--amber);box-shadow:0 24px 50px -24px var(--glow)}
.cat .ic{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;background:rgba(251,176,45,.14);color:var(--amber);font-size:1.7rem;margin-bottom:18px;transition:.4s}
.cat:hover .ic{background:var(--amber);color:#2a1c00;transform:rotate(-8deg) scale(1.08)}
.cat h3{margin-bottom:6px}.cat p{color:var(--mute);font-size:.95rem}
.tabs{display:flex;gap:8px;margin-bottom:26px;overflow-x:auto;padding-bottom:4px}
.tabs button{white-space:nowrap;padding:9px 20px;border-radius:99px;background:var(--card);border:1px solid var(--line);cursor:pointer;transition:.25s}
.tabs button.on{background:var(--amber);color:#2a1c00;border-color:var(--amber);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.p{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;transition:.35s;display:flex;flex-direction:column}
.p:hover{transform:translateY(-7px);box-shadow:0 22px 44px -22px var(--glow);border-color:var(--amber)}
.p .img{height:170px;border-radius:16px;display:grid;place-items:center;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 35%,var(--c),transparent 72%),var(--bg)}
.p .img svg{height:130px;transition:.45s}
.p:hover .img svg{transform:scale(1.1) rotate(-6deg)}
.tag{position:absolute;top:10px;left:10px;font-size:.72rem;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--amber);color:#2a1c00}
.p h4{margin-top:14px;font-size:1.02rem}
.p .meta{color:var(--mute);font-size:.84rem}
.price{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:14px}
.price b{font-size:1.18rem;color:var(--amber)}
.price s{color:var(--mute);font-size:.82rem;margin-left:6px}
.add{width:40px;height:40px;border-radius:12px;border:0;cursor:pointer;background:rgba(251,176,45,.15);color:var(--amber);font-size:1.1rem;transition:.3s}
.add:hover{background:var(--amber);color:#2a1c00;transform:rotate(90deg)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;counter-reset:s}
.st{padding:26px;border-radius:22px;border:1px solid var(--line);background:var(--card);position:relative;counter-increment:s}
.st::before{content:counter(s);position:absolute;top:-16px;left:22px;width:34px;height:34px;border-radius:50%;background:var(--amber);color:#2a1c00;font-weight:800;display:grid;place-items:center;box-shadow:0 0 0 6px var(--bg2)}
.st h3{margin:8px 0 4px;font-size:1.05rem}.st p{color:var(--mute);font-size:.92rem}
.trust{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;text-align:center}
.trust div{padding:22px}.trust .ic{font-size:2rem;color:var(--amber)}.trust h4{margin:8px 0 2px}.trust p{color:var(--mute);font-size:.9rem}
footer{background:#15120e;color:#f7f3ea;padding:56px 0 28px}
.fg{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:32px}
footer img{height:42px;margin-bottom:14px}
footer p,footer li{color:#a79f90;font-size:.93rem}
footer ul{list-style:none;display:grid;gap:8px}
footer h5{margin-bottom:12px;color:var(--amber);font-size:1rem}
.copy{border-top:1px solid rgba(255,255,255,.09);margin-top:34px;padding-top:18px;color:#a79f90;font-size:.85rem;text-align:center}
.wa{position:fixed;right:18px;bottom:18px;z-index:60;width:56px;height:56px;border-radius:50%;background:#25d366;color:#fff;display:grid;place-items:center;font-size:1.6rem;box-shadow:0 10px 28px -6px rgba(37,211,102,.6);animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,30px);opacity:0;background:var(--amber);color:#2a1c00;padding:10px 20px;border-radius:99px;font-weight:700;transition:.4s;z-index:70;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* motion: one page-load sequence + gentle scroll reveal */
.in{opacity:0;transform:translateY(22px);animation:up .8s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes up{to{opacity:1;transform:none}}
.rv{opacity:0;transform:translateY(26px);transition:opacity .8s,transform .8s cubic-bezier(.2,.8,.2,1)}
.rv.vis{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.in,.rv{opacity:1;transform:none}}

@media(max-width:960px){.hero .wrap{grid-template-columns:1fr}.grid,.steps,.trust{grid-template-columns:repeat(2,1fr)}.cats{grid-template-columns:1fr}.nav nav{display:none}.tools{margin-left:auto}.fg{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.grid{gap:12px}.p{padding:12px}.p .img{height:130px}.p .img svg{height:100px}.steps,.trust{grid-template-columns:1fr}.fg{grid-template-columns:1fr}.stats{gap:20px}section{padding:60px 0}.hero{padding:44px 0 60px}.nav img{height:30px}}
</style>
</head>

en:{n1:"Categories",n2:"Shop",n3:"Exchange",n4:"Contact",open:"Open now · Dhaka",h1a:"Buy. Sell.",h1b:"Exchange.",lead:"New phones, pre-owned devices and smart gadgets in one place. Trade in your old phone for a new one — simply and safely.",c1:"Browse phones",c2:"Get my price",s1:"Happy customers",s2:"Exchanges done",s3:"Positive reviews",e1:"Know your phone's value",e2:"Pick your model and condition to see an instant estimate.",e3:"Your phone",e4:"Condition",e5:"Estimated exchange value",e6:"Confirm in store",c_good:"Good",c_fair:"Fair",c_poor:"Worn",k1:"What are you looking for?",k2:"Three easy ways: buy, swap, or grab a gadget.",k3:"New phones",k4:"All major brands with official warranty.",k5:"Phone exchange",k6:"Hand in your old phone and put it toward a new one.",k7:"Gadgets & accessories",k8:"Earbuds, smartwatches, power banks and more.",p1:"Popular picks",p2:"Demo products — your real stock goes here.",all:"All",new:"New phones",used:"Pre-owned",gadget:"Gadgets",h_1:"Exchange in four steps",t1:"Choose a phone",t1d:"Pick the new phone you want.",t2:"Check your price",t2d:"See an estimate for your old phone.",t3:"Verify in store",t3d:"Our technician inspects your phone.",t4:"Take it home",t4d:"Pay the difference and walk out with your new phone.",u1:"100% genuine",u1d:"Warranty on every phone.",u2:"Nationwide delivery",u2d:"Fast shipping to all 64 districts.",u3:"Best prices",u3d:"Matched to the market rate.",u4:"Direct support",u4d:"On WhatsApp, any time.",f1:"Buy · Sell · Exchange. A trusted mobile shop in Bangladesh.",f2:"Contact",f3:"Opening hours",addr:"Your shop address, Dhaka",hr1:"Sat–Thu: 10 AM – 9 PM",hr2:"Fri: 3 PM – 9 PM",added:"Added to cart",cur:"en-US"}};

let lang=localStorage.getItem("mz_lang")||"bn",filter="all",cond=0,rate=1;
const $=s=>document.querySelector(s),L=()=>T[lang];
const fmt=n=>"৳"+Math.round(n).toLocaleString(L().cur);
const phoneSVG=c=>`<svg viewBox="0 0 60 110"><rect x="4" y="2" width="52" height="106" rx="10" fill="#111" stroke="${c}" stroke-width="2"/><rect x="8" y="8" width="44" height="94" rx="7" fill="${c}" opacity=".85"/><rect x="22" y="10" width="16" height="4" rx="2" fill="#111"/></svg>`;

function render(){
  const t=L();document.documentElement.lang=lang;
  document.querySelectorAll("[data-i]").forEach(e=>e.textContent=t[e.dataset.i]);
  $("#lang").textContent=lang==="bn"?"EN":"বাং";
  $("#model").innerHTML=MODELS.map((m,i)=>`<option value="${i}">${m[0]}</option>`).join("");
  $("#model").value=window._mi||0;
  $("#cond").innerHTML=CONDS.map((c,i)=>`<button class="${i===cond?"on":""}" data-c="${i}">${t[c[0]]}</button>`).join("");
  $("#tabs").innerHTML=["all","new","used","gadget"].map(k=>`<button class="${k===filter?"on":""}" data-f="${k}">${t[k]}</button>`).join("");
  $("#grid").innerHTML=PRODUCTS.filter(p=>filter==="all"||p.t===filter).map(p=>`<article class="p"><div class="img" style="--c:${p.c}55">${phoneSVG(p.c)}<span class="tag">${t[p.t]}</span></div><h4>${p.n}</h4><div class="meta">${p.m}</div><div class="price"><div><b>${fmt(p.p)}</b>${p.o?`<s>${fmt(p.o)}</s>`:""}</div><button class="add" aria-label="add" data-add>+</button></div></article>`).join("");
  document.querySelectorAll("[data-n]").forEach(e=>e.dataset.done&&(e.textContent=Number(e.dataset.n).toLocaleString(t.cur)+e.dataset.s));
  estimate(true);
}
function estimate(now){
  const target=MODELS[$("#model").value][1]*CONDS[cond][1],el=$("#val");
  if(now){el.textContent=fmt(target);rate=target;return}
  const from=rate,t0=performance.now();
  (function f(t){const k=Math.min((t-t0)/600,1),e=1-Math.pow(1-k,3);el.textContent=fmt(from+(target-from)*e);k<1?requestAnimationFrame(f):rate=target})(t0);
}
document.addEventListener("click",e=>{
  const c=e.target.closest("[data-c]"),f=e.target.closest("[data-f]");
  if(c){cond=+c.dataset.c;document.querySelectorAll("#cond button").forEach(b=>b.classList.toggle("on",b===c));estimate()}
  if(f){filter=f.dataset.f;render()}
  if(e.target.closest("[data-add]")){const x=$("#toast");x.textContent="✓ "+L().added;x.classList.add("show");setTimeout(()=>x.classList.remove("show"),1600)}
});
$("#model").addEventListener("change",e=>{window._mi=e.target.value;estimate()});
$("#lang").onclick=()=>{lang=lang==="bn"?"en":"bn";localStorage.setItem("mz_lang",lang);render()};
const root=document.documentElement,setTheme=m=>{root.dataset.theme=m;$("#theme").textContent=m==="dark"?"☀️":"🌙";localStorage.setItem("mz_theme",m)};
setTheme(localStorage.getItem("mz_theme")||(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark"));
$("#theme").onclick=()=>setTheme(root.dataset.theme==="dark"?"light":"dark");

render();

/* scroll reveal + count-up */
const io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add("vis");io.unobserve(x.target)}}),{threshold:.15});
document.querySelectorAll(".rv").forEach(e=>io.observe(e));
document.querySelectorAll("[data-n]").forEach(e=>{const n=+e.dataset.n,t0=performance.now()+700;
  (function f(t){const k=Math.max(0,Math.min((t-t0)/1600,1));e.textContent=Math.round(n*(1-Math.pow(1-k,3))).toLocaleString(L().cur)+e.dataset.s;k<1?requestAnimationFrame(f):e.dataset.done=1})(t0)});
</script>
