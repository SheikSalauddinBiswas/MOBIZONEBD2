<!DOCTYPE html>
<html lang="bn" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MobiZone BD — Buy · Sell · Exchange | Chattogram</title>
<meta name="description" content="Sealed phones, honest trade-ins and genuine gadgets. Two stores in Chattogram: Reazuddin Bazar and Nasirabad.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--amber:#fbb02d;--amber2:#ffd27a;--bg:#120f0b;--bg2:#1a160f;--card:#211c14;--text:#f7f3ea;--mute:#a79f90;--line:rgba(255,255,255,.09);--glow:rgba(251,176,45,.3)}
[data-theme=light]{--bg:#f3f4f7;--bg2:#fff;--card:#fff;--text:#1b1812;--mute:#6b6558;--line:rgba(0,0,0,.09);--glow:rgba(251,176,45,.38)}
*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}
body{font-family:'Outfit','Hind Siliguri',sans-serif;background:var(--bg);color:var(--text);line-height:1.6;transition:background .4s,color .4s;overflow-x:hidden}
html[lang=bn] body{font-family:'Hind Siliguri','Outfit',sans-serif}
a{color:inherit;text-decoration:none}button,select{font:inherit;color:inherit}:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
.wrap{width:min(1180px,92%);margin:auto}
svg.i{width:1.2em;height:1.2em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em}
#bar{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--amber),var(--amber2));z-index:99}
header{position:sticky;top:0;z-index:50;background:rgba(18,15,11,.8);backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,.08);color:#f7f3ea}
.nav{display:flex;align-items:center;gap:22px;height:70px}.nav img{height:38px}
.nav nav{margin-left:auto;display:flex;gap:26px;font-weight:500;font-size:.95rem}
.nav nav a{opacity:.78;transition:.25s}.nav nav a:hover{opacity:1;color:var(--amber)}
.tools{display:flex;gap:8px;align-items:center}
.chip{border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);border-radius:99px;padding:7px 14px;cursor:pointer;font-weight:600;font-size:.85rem;transition:.25s;color:#f7f3ea;display:inline-flex;gap:6px;align-items:center}
.chip:hover{border-color:var(--amber);color:var(--amber);transform:translateY(-1px)}
.chip.call{background:var(--amber);color:#2a1c00;border-color:var(--amber)}.chip.call:hover{color:#2a1c00;box-shadow:0 8px 22px -6px var(--glow)}
/* hero */
.hero{position:relative;padding:70px 0 96px;overflow:hidden}
.hero::before{content:"";position:absolute;width:760px;height:760px;right:-200px;top:-160px;background:radial-gradient(circle,var(--glow),transparent 62%);animation:pulse 7s ease-in-out infinite}
.hero::after{content:"";position:absolute;inset:0;background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:30px 30px;mask-image:radial-gradient(ellipse at 70% 40%,#000,transparent 70%);-webkit-mask-image:radial-gradient(ellipse at 70% 40%,#000,transparent 70%)}
@keyframes pulse{50%{transform:scale(1.15);opacity:.65}}
.hero .wrap{display:grid;grid-template-columns:1.05fr .95fr;gap:40px;align-items:center;position:relative;z-index:1}
.badge{display:inline-flex;gap:9px;align-items:center;border:1px solid var(--line);background:var(--bg2);padding:7px 16px;border-radius:99px;font-size:.85rem;color:var(--mute)}
.badge b{width:8px;height:8px;border-radius:50%;background:#3ecf6e;animation:ping 1.8s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(62,207,110,.7)}70%,100%{box-shadow:0 0 0 10px transparent}}
h1{font-size:clamp(2.3rem,5.4vw,4.2rem);line-height:1.1;font-weight:800;margin:20px 0;letter-spacing:-.025em}
h1 span{display:block;background:linear-gradient(90deg,var(--amber),var(--amber2),var(--amber));background-size:200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 5s linear infinite}
@keyframes shine{to{background-position:200%}}
.lead{color:var(--mute);max-width:46ch;font-size:1.08rem}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:14px 26px;border-radius:16px;font-weight:700;cursor:pointer;border:1px solid var(--line);background:var(--bg2);transition:.3s;position:relative;overflow:hidden}
.btn:hover{transform:translateY(-3px)}
.btn.pri{background:linear-gradient(135deg,var(--amber),#f59a0c);color:#2a1c00;border:0;box-shadow:0 12px 32px -8px var(--glow)}
.btn.pri::after{content:"";position:absolute;top:0;left:-70%;width:50%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);animation:sweep 3.6s infinite}
@keyframes sweep{60%,100%{left:130%}}
.stats{display:flex;gap:36px;margin-top:40px}.stats b{font-size:1.9rem;color:var(--amber);display:block;line-height:1.1}.stats small{color:var(--mute)}
.stage{position:relative;aspect-ratio:1;max-width:480px;margin:auto;width:100%;perspective:900px}
.disc{position:absolute;inset:6%;border-radius:50%;background:radial-gradient(circle at 50% 30%,#fff,#e6e2d8);box-shadow:0 0 0 12px rgba(251,176,45,.12),0 0 0 26px rgba(251,176,45,.06),0 40px 90px -20px var(--glow)}
.ring{position:absolute;inset:-2%;border-radius:50%;border:1.5px dashed var(--amber);opacity:.5;animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tilt{position:absolute;inset:0;transition:transform .2s;transform-style:preserve-3d}
.slide{position:absolute;inset:0;display:grid;place-items:center;opacity:0;transform:scale(.88) translateY(14px);transition:.9s cubic-bezier(.2,.8,.2,1)}
.slide.on{opacity:1;transform:none}
.slide img{height:86%;max-width:70%;object-fit:contain;filter:drop-shadow(0 28px 26px rgba(0,0,0,.35));animation:float 5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-12px)}}
.float{position:absolute;background:rgba(30,25,18,.85);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.14);color:#f7f3ea;border-radius:16px;padding:10px 14px;font-size:.85rem;display:flex;gap:8px;align-items:center;animation:float 6s ease-in-out infinite;box-shadow:0 14px 30px -12px rgba(0,0,0,.5)}
.float.a{left:-2%;top:16%}.float.b{right:-3%;bottom:20%;animation-delay:-2.5s}.float svg{color:var(--amber)}
.pname{text-align:center;margin-top:14px;font-weight:700;min-height:3em}.pname small{display:block;color:var(--amber);font-size:1.05rem}
/* brands marquee */
.brands{border-block:1px solid var(--line);background:var(--bg2);overflow:hidden;padding:18px 0}
.mq{display:flex;gap:56px;width:max-content;animation:mq 34s linear infinite}.brands:hover .mq{animation-play-state:paused}
.mq span{font-weight:800;font-size:1.35rem;color:var(--mute);opacity:.7;transition:.3s;letter-spacing:.02em}.mq span:hover{color:var(--amber);opacity:1}
@keyframes mq{to{transform:translateX(-50%)}}
section{padding:88px 0}.alt{background:var(--bg2)}
.head{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:36px;flex-wrap:wrap}
h2{font-size:clamp(1.7rem,3.4vw,2.5rem);font-weight:800;letter-spacing:-.015em}.head p{color:var(--mute);max-width:48ch}
/* spotlight cards */
.sp{position:relative;overflow:hidden}
.sp::before{content:"";position:absolute;inset:0;background:radial-gradient(260px circle at var(--mx,50%) var(--my,0%),var(--glow),transparent 70%);opacity:0;transition:opacity .3s;pointer-events:none}
.sp:hover::before{opacity:1}.sp>*{position:relative}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.cat{padding:32px;border-radius:26px;background:var(--card);border:1px solid var(--line);transition:.4s}
.cat:hover{transform:translateY(-8px);border-color:var(--amber)}
.cat .ic{width:60px;height:60px;border-radius:19px;display:grid;place-items:center;background:rgba(251,176,45,.14);color:var(--amber);font-size:1.7rem;margin-bottom:18px;transition:.4s}
.cat:hover .ic{background:var(--amber);color:#2a1c00;transform:rotate(-8deg) scale(1.08)}
.cat h3{margin-bottom:6px}.cat p{color:var(--mute);font-size:.95rem}
.tabs{display:flex;gap:8px;margin-bottom:26px;overflow-x:auto;padding-bottom:4px}
.tabs button{white-space:nowrap;padding:9px 20px;border-radius:99px;background:var(--card);border:1px solid var(--line);cursor:pointer;transition:.25s}
.tabs button.on{background:var(--amber);color:#2a1c00;border-color:var(--amber);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.p{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:14px;transition:.35s;display:flex;flex-direction:column;animation:pop .5s both}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.97)}}
.p:hover{transform:translateY(-8px);border-color:var(--amber);box-shadow:0 26px 50px -26px var(--glow)}
.p .img{height:190px;border-radius:18px;display:grid;place-items:center;background:radial-gradient(circle at 50% 30%,#fff,#e8e4da);position:relative;overflow:hidden}
.p .img img{height:88%;max-width:80%;object-fit:contain;transition:.5s;filter:drop-shadow(0 12px 12px rgba(0,0,0,.25))}
.p:hover .img img{transform:scale(1.1) rotate(-4deg)}
.tag{position:absolute;top:10px;left:10px;font-size:.72rem;font-weight:700;padding:3px 11px;border-radius:99px;background:#1b1812;color:var(--amber)}
.heart{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(0,0,0,.08);cursor:pointer;font-size:1rem;color:#555;transition:.3s}
.heart.on{background:#ff4d6d;color:#fff;transform:scale(1.15)}
.p h4{margin-top:14px;font-size:1.02rem;line-height:1.3}.p .meta{color:var(--mute);font-size:.84rem}
.price{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:14px}.price b{font-size:1.2rem;color:var(--amber)}
.wa-b{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:rgba(37,211,102,.14);color:#25d366;transition:.3s;font-size:1.15rem}
.wa-b:hover{background:#25d366;color:#fff;transform:scale(1.1) rotate(-6deg)}
.more{text-align:center;margin-top:34px}
/* estimator */
.est-wrap{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center}
.est{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:30px;box-shadow:0 30px 70px -34px rgba(0,0,0,.55)}
.est h3{font-size:1.25rem;margin-bottom:4px}label{display:block;font-size:.82rem;color:var(--mute);margin:14px 0 6px}
select{width:100%;padding:13px 14px;border-radius:13px;background:var(--bg);border:1px solid var(--line);cursor:pointer}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg button{padding:11px 6px;border-radius:13px;background:var(--bg);border:1px solid var(--line);cursor:pointer;transition:.25s;font-size:.9rem}
.seg button.on{background:var(--amber);color:#2a1c00;border-color:var(--amber);font-weight:700;transform:scale(1.04)}
.res{margin-top:22px;padding:20px;border-radius:20px;background:linear-gradient(135deg,rgba(251,176,45,.18),rgba(251,176,45,.04));border:1px dashed var(--amber);text-align:center}
.res small{color:var(--mute)}.res b{display:block;font-size:2.3rem;color:var(--amber);font-weight:800;line-height:1.2}
.steps{display:grid;gap:14px;margin-top:22px;counter-reset:s}
.st{display:flex;gap:14px;align-items:flex-start;counter-increment:s}
.st::before{content:counter(s);flex:none;width:34px;height:34px;border-radius:50%;background:var(--amber);color:#2a1c00;font-weight:800;display:grid;place-items:center}
.st h4{line-height:1.3}.st p{color:var(--mute);font-size:.92rem}
.trust{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.tr{padding:26px;border-radius:22px;border:1px solid var(--line);background:var(--card);display:flex;gap:16px;transition:.35s}
.tr:hover{transform:translateY(-5px);border-color:var(--amber)}
.tr .ic{flex:none;width:50px;height:50px;border-radius:16px;display:grid;place-items:center;background:rgba(251,176,45,.14);color:var(--amber);font-size:1.5rem}
.tr h4{line-height:1.3}.tr p{color:var(--mute);font-size:.9rem}
.stores{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.store{padding:30px;border-radius:26px;background:var(--card);border:1px solid var(--line)}
.store h3{font-size:1.3rem;margin-bottom:6px}.store p{color:var(--mute);margin-bottom:4px}
.store .row{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}.store .btn{padding:11px 20px;font-size:.92rem}
footer{background:#120f0b;color:#f7f3ea;padding:60px 0 28px}
.fg{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:32px}footer img{height:42px;margin-bottom:14px}
footer p,footer li{color:#a79f90;font-size:.93rem}footer ul{list-style:none;display:grid;gap:8px}footer h5{margin-bottom:12px;color:var(--amber);font-size:1rem}
.soc{display:flex;gap:10px;margin-top:16px}.soc a{width:40px;height:40px;border-radius:12px;border:1px solid rgba(255,255,255,.15);display:grid;place-items:center;font-weight:700;font-size:.8rem;transition:.3s}.soc a:hover{background:var(--amber);color:#2a1c00;transform:translateY(-3px)}
.copy{border-top:1px solid rgba(255,255,255,.09);margin-top:34px;padding-top:18px;color:#a79f90;font-size:.85rem;text-align:center}
.wa{position:fixed;right:18px;bottom:18px;z-index:60;width:58px;height:58px;border-radius:50%;background:#25d366;color:#fff;display:grid;place-items:center;font-size:1.7rem;box-shadow:0 10px 28px -6px rgba(37,211,102,.6);animation:float 2.8s ease-in-out infinite}
.in{opacity:0;transform:translateY(24px);animation:up .9s cubic-bezier(.2,.8,.2,1) forwards}@keyframes up{to{opacity:1;transform:none}}
.rv{opacity:0;transform:translateY(28px);transition:opacity .8s,transform .8s cubic-bezier(.2,.8,.2,1)}.rv.vis{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.in,.rv{opacity:1;transform:none}.slide.on{opacity:1}}
@media(max-width:960px){.hero .wrap,.est-wrap,.stores{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}.cats,.trust{grid-template-columns:1fr}.nav nav{display:none}.tools{margin-left:auto}.fg{grid-template-columns:1fr 1fr}.stage{max-width:380px}}
@media(max-width:560px){.grid{gap:12px}.p{padding:10px}.p .img{height:140px}.fg{grid-template-columns:1fr}.stats{gap:22px}section{padding:60px 0}.hero{padding:44px 0 60px}.nav img{height:30px}.chip.call span{display:none}.float{display:none}}
</style>
</head>
