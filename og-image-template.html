<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1200px;height:630px;overflow:hidden}
body{position:relative;background:#120f0b;color:#f7f3ea;font-family:'Inter','Helvetica Neue',Arial,sans-serif}
.bg{position:absolute;inset:0;background:
 radial-gradient(620px 620px at 905px 300px,rgba(251,176,45,.36),transparent 68%),
 radial-gradient(520px 380px at -60px 700px,rgba(251,176,45,.13),transparent 70%),
 linear-gradient(120deg,#17120c,#0d0a07 70%)}
.dots{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.075) 1.5px,transparent 1.5px);background-size:34px 34px;
 -webkit-mask-image:radial-gradient(ellipse at 76% 45%,#000,transparent 72%);mask-image:radial-gradient(ellipse at 76% 45%,#000,transparent 72%)}
.frame{position:absolute;inset:22px;border-radius:30px;border:1.5px solid rgba(251,176,45,.28)}
.frame::after{content:"";position:absolute;inset:7px;border-radius:24px;border:1px solid rgba(255,255,255,.05)}
/* left */
.l{position:absolute;left:78px;top:70px;width:640px;bottom:70px;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:16px}
.mark{width:58px;height:58px;border-radius:18px;background:linear-gradient(145deg,#ffd27a,#f59a0c);display:grid;place-items:center;box-shadow:0 12px 30px -8px rgba(251,176,45,.7),inset 0 1px 0 rgba(255,255,255,.55)}
.mark svg{width:32px;height:32px}
.bn{font-size:34px;font-weight:800;letter-spacing:-.02em}.bn b{color:#fbb02d;font-weight:800}
.tag{margin-left:6px;padding:6px 14px;border-radius:99px;border:1px solid rgba(251,176,45,.4);background:rgba(251,176,45,.1);color:#ffd27a;font-size:15px;font-weight:600;letter-spacing:.14em;text-transform:uppercase}
h1{margin-top:44px;font-size:80px;line-height:1.02;font-weight:800;letter-spacing:-.035em}
h1 span{display:block;background:linear-gradient(90deg,#fbb02d,#ffd27a 55%,#fbb02d);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin-top:26px;font-size:24px;line-height:1.5;color:#b9b09f;max-width:600px;font-weight:500}
.sub em{font-style:normal;color:#f7f3ea}
.row{margin-top:auto;display:flex;gap:12px;align-items:center}
.pill{display:inline-flex;gap:9px;align-items:center;padding:11px 20px;border-radius:99px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);font-size:20px;font-weight:600;color:#f7f3ea}
.pill svg{width:20px;height:20px;stroke:#fbb02d;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pill.wa{background:linear-gradient(135deg,#fbb02d,#f59a0c);color:#2a1c00;border:0;font-weight:800;box-shadow:0 14px 34px -10px rgba(251,176,45,.8)}
.pill.wa svg{stroke:#2a1c00}
/* right: phones */
.r{position:absolute;right:46px;top:0;width:500px;height:630px;transform:scale(.88);transform-origin:50% 50%}
.ring{position:absolute;left:60px;top:105px;width:420px;height:420px;border-radius:50%;border:2px dashed rgba(251,176,45,.5)}
.ring.b{left:20px;top:65px;width:500px;height:500px;border:1px solid rgba(251,176,45,.16)}
.disc{position:absolute;left:92px;top:137px;width:356px;height:356px;border-radius:50%;background:radial-gradient(circle at 50% 28%,rgba(255,255,255,.96),#e4dfd2);box-shadow:0 0 0 14px rgba(251,176,45,.12),0 50px 100px -20px rgba(251,176,45,.55)}
.ph{position:absolute;border-radius:46px;background:linear-gradient(150deg,#3a3326,#14110b 55%,#2a2318);padding:9px;box-shadow:0 40px 70px -16px rgba(0,0,0,.75),inset 0 0 0 2px rgba(255,255,255,.12),inset 0 0 0 4px rgba(0,0,0,.6)}
.ph .s{position:relative;width:100%;height:100%;border-radius:38px;overflow:hidden}
.ph .isl{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:84px;height:25px;border-radius:99px;background:#050403;z-index:2}
.ph.a{left:104px;top:92px;width:226px;height:462px;transform:rotate(-8deg);z-index:2}
.ph.a .s{background:radial-gradient(120% 70% at 30% 0%,#ffd27a,transparent 60%),linear-gradient(165deg,#f59a0c,#8f3a05 55%,#2a1203)}
.ph.b2{left:262px;top:128px;width:208px;height:424px;transform:rotate(9deg);z-index:1}
.ph.b2 .s{background:radial-gradient(110% 70% at 80% 0%,#6fb5ff,transparent 60%),linear-gradient(165deg,#245fd1,#14214f 60%,#0a0f26)}
.ph .gl{position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.22),transparent 38%)}
.ph .cam{position:absolute;left:14px;top:46px;width:74px;height:74px;border-radius:22px;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(4px)}
.ph .cam i{position:absolute;width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#4a5a78,#05070c 60%);box-shadow:0 0 0 3px rgba(255,255,255,.12)}
.ph .cam i:nth-child(1){left:8px;top:8px}.ph .cam i:nth-child(2){left:40px;top:8px}.ph .cam i:nth-child(3){left:24px;top:38px}
.ph .time{position:absolute;left:0;right:0;bottom:92px;text-align:center;font-size:58px;font-weight:300;letter-spacing:-.03em;color:rgba(255,255,255,.95)}
.ph .bar{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);width:74px;height:5px;border-radius:9px;background:rgba(255,255,255,.7)}
.ph.b2 .time{bottom:80px;font-size:50px}
.chipf{position:absolute;z-index:5;display:flex;align-items:center;gap:10px;padding:11px 18px 11px 12px;border-radius:99px;background:rgba(20,16,10,.82);border:1px solid rgba(251,176,45,.45);font-size:19px;font-weight:700;color:#f7f3ea;box-shadow:0 18px 40px -12px rgba(0,0,0,.8)}
.chipf i{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#ffd27a,#f59a0c);display:grid;place-items:center}
.chipf i svg{width:16px;height:16px;stroke:#2a1c00;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.c1{left:20px;top:112px}.c2{right:42px;top:468px}
</style></head><body>
<div class="bg"></div><div class="dots"></div><div class="frame"></div>
<div class="l">
  <div class="brand">
    <div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="#2a1c00" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="6.5" y="2.5" width="11" height="19" rx="3"/><path d="M10.5 18.5h3"/></svg></div>
    <div class="bn">Mobi<b>Zone</b> BD</div>
    <div class="tag">Chattogram</div>
  </div>
  <h1>Buy · Sell<span>Exchange</span></h1>
  <p class="sub"><em>Sealed phones</em>, honest trade-ins, genuine gadgets.</p>
  <div class="row">
    <div class="pill"><svg viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>Reazuddin Bazar</div>
    <div class="pill"><svg viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>Nasirabad</div>
  </div>
  <div class="row" style="margin-top:14px"><div class="pill wa"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 0 1-13.4 7.8L3 21l1.3-4.4A9 9 0 1 1 21 12z"/></svg>WhatsApp 01960-880808</div></div>
</div>
<div class="r">
  <div class="ring b"></div><div class="ring"></div><div class="disc"></div>
  <div class="ph b2"><div class="s"><div class="isl"></div><div class="gl"></div><div class="time">9:41</div><div class="bar"></div></div></div>
  <div class="ph a"><div class="s"><div class="isl"></div><div class="gl"></div><div class="cam"><i></i><i></i><i></i></div><div class="time">9:41</div><div class="bar"></div></div></div>
  <div class="chipf c1"><i><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></i>Genuine</div>
  <div class="chipf c2"><i><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></i>Honest trade-in</div>
</div>
</body></html>
